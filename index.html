<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المنصة الإلكترونية للمعلم فيصل بن تويم الزهراني</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="login-body">
  <div class="login-wrap">
    <div class="login-brand">
      <div class="brand-pattern"></div>
      <div class="brand-content">
        <div class="brand-badge">منصة تعليمية</div>
        <h1>المنصة الإلكترونية<br>للمعلم <span class="gold">فيصل بن تويم الزهراني</span></h1>
        <p class="brand-sub">مادة المهارات الرقمية — مدرسة ابن الخطيب المتوسطة</p>
        <div class="role-strip">
          <span class="role-chip">معلم</span>
          <span class="role-chip">طالب</span>
          <span class="role-chip">مشرف</span>
        </div>
      </div>
    </div>
    <div class="login-form-panel">
      <div class="login-form-inner">
        <h2>تسجيل الدخول</h2>
        <p class="muted">أدخل بيانات حسابك للمتابعة</p>
        <form id="loginForm">
          <label>البريد الإلكتروني</label>
          <input type="email" id="email" required placeholder="example@email.com">
          <label>كلمة المرور</label>
          <input type="password" id="password" required placeholder="••••••••">
          <div id="loginError" class="error-msg" style="display:none;"></div>
          <button type="submit" class="btn-primary full">دخول</button>
        </form>
      </div>
    </div>
  </div>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
